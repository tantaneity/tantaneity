name: readme

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: python scripts/build_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "tantaneity"
          git config user.email "matveevnikita0906@gmail.com"
          git commit -am "docs: refresh the generator row"
          git push
